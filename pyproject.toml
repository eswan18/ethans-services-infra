[project]
name = "ethans-services-infra"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "pulumi>=3.0.0,<4.0.0",
    "pulumi-gcp>=9.0.0,<10.0.0",
    "pulumi-kubernetes>=4.0.0,<5.0.0",
]

[tool.uv]
# Nothing here is installed as a package. Pulumi runs `__main__.py` from the
# project directory against the venv `uv sync` creates; it needs the `pulumi*`
# dependencies importable, not this project on sys.path.
package = false

[dependency-groups]
dev = [
    "ruff>=0.15.0",
]
